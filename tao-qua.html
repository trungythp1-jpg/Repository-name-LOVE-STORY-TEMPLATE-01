<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#180c18"
    >

    <title>Tạo món quà • Love Story</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/tao-qua.css"
    >

</head>


<body>

    <div
        id="hearts"
        class="hearts"
    ></div>


    <main class="page active">

        <div class="container">

            <div class="glass-card create-card">


                <div class="logo">
                    LOVE STORY • DIGITAL GIFT
                </div>


                <h1>
                    Tạo một món quà
                </h1>


                <p class="subtitle">
                    Tạo một câu chuyện nhỏ
                    dành riêng cho người bạn yêu ❤️
                </p>



                <!-- TÊN -->

                <div class="form-group">

                    <label for="couple">
                        Tên hai người
                    </label>

                    <input
                        id="couple"
                        type="text"
                        maxlength="80"
                        placeholder="Ví dụ: Trung & Trang"
                    >

                </div>



                <!-- NGƯỜI NHẬN -->

                <div class="form-group">

                    <label for="receiver">
                        Món quà dành cho
                    </label>

                    <input
                        id="receiver"
                        type="text"
                        maxlength="60"
                        placeholder="Ví dụ: Trang"
                    >

                </div>



                <!-- NGÀY -->

                <div class="form-group">

                    <label for="date">
                        Ngày bắt đầu câu chuyện
                    </label>

                    <input
                        id="date"
                        type="date"
                    >

                </div>



                <!-- NHẠC -->

                <div class="form-group">

                    <label for="music">
                        Bài hát YouTube
                        <span>(không bắt buộc)</span>
                    </label>

                    <input
                        id="music"
                        type="text"
                        placeholder="Dán link YouTube..."
                    >

                </div>



                <!-- GIAO DIỆN -->

                <div class="form-group">

                    <label>
                        Chọn giao diện quà tặng
                    </label>


                    <div class="theme-grid">


                        <label class="theme-option">

                            <input
                                type="radio"
                                name="theme"
                                value="pink"
                                checked
                            >

                            <div class="theme-preview pink">

                                <strong>💗</strong>

                                <span>
                                    Romantic Pink
                                </span>

                            </div>

                        </label>



                        <label class="theme-option">

                            <input
                                type="radio"
                                name="theme"
                                value="midnight"
                            >

                            <div class="theme-preview midnight">

                                <strong>🌌</strong>

                                <span>
                                    Midnight Love
                                </span>

                            </div>

                        </label>



                        <label class="theme-option">

                            <input
                                type="radio"
                                name="theme"
                                value="rose"
                            >

                            <div class="theme-preview rose">

                                <strong>🌹</strong>

                                <span>
                                    Rose Red
                                </span>

                            </div>

                        </label>



                        <label class="theme-option">

                            <input
                                type="radio"
                                name="theme"
                                value="gold"
                            >

                            <div class="theme-preview gold">

                                <strong>✨</strong>

                                <span>
                                    Elegant Gold
                                </span>

                            </div>

                        </label>



                        <label class="theme-option">

                            <input
                                type="radio"
                                name="theme"
                                value="green"
                            >

                            <div class="theme-preview green">

                                <strong>🌿</strong>

                                <span>
                                    Dreamy Green
                                </span>

                            </div>

                        </label>



                        <label class="theme-option">

                            <input
                                type="radio"
                                name="theme"
                                value="pastel"
                            >

                            <div class="theme-preview pastel">

                                <strong>🌸</strong>

                                <span>
                                    Pastel Love
                                </span>

                            </div>

                        </label>

                    </div>

                </div>



                <!-- LỜI NHẮN -->

                <div class="form-group">

                    <label for="letter">
                        Lời nhắn dành cho người ấy
                    </label>

                    <textarea
                        id="letter"
                        maxlength="3000"
                        placeholder="Viết những điều bạn muốn nói..."
                    ></textarea>

                </div>



                <!-- BUTTON -->

                <button
                    id="createButton"
                    class="primary-button"
                >
                    💝 Tạo món quà
                </button>



                <!-- KẾT QUẢ -->

                <div
                    id="result"
                    class="result"
                >

                    <h2>
                        🎁 Món quà đã sẵn sàng
                    </h2>


                    <div
                        id="generatedLink"
                        class="generated-link"
                    ></div>


                    <div class="qr-container">

                        <img
                            id="qrCode"
                            alt="QR Code"
                        >

                    </div>


                    <p class="qr-description">
                        Quét mã QR để mở món quà
                    </p>


                    <div class="result-buttons">

                        <button
                            id="copyButton"
                            class="secondary-button"
                        >
                            📋 Sao chép link
                        </button>


                        <button
                            id="openButton"
                            class="secondary-button"
                        >
                            💌 Mở thử
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="js/common.js"></script>

    <script src="js/tao-qua.js"></script>

</body>

</html>
